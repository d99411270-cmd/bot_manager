[project]
name = "stokozavr-telegram-bot"
version = "0.1.0"
description = "Telegram sales assistant for Stokozavr"
requires-python = ">=3.10"
dependencies = [
  "aiogram>=3.13,<4",
  "aiohttp-socks>=0.10.1,<0.13",
  "httpx>=0.27,<1",
  "gspread>=6.1,<7",
  "google-auth>=2.35,<3",
  "pydantic-settings>=2.5,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.24,<1",
  "ruff>=0.7,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/stokozavr_bot"]

[tool.hatch.build.targets.wheel.force-include]
"prompts" = "stokozavr_bot/prompts"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
